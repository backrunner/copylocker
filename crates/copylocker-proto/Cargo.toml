[package]
name = "copylocker-proto"
description = "CopyLocker wire protocol: artifacts, envelopes, certificate chains, license keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["copylocker-suite/std", "copylocker-types/std"]

[dependencies]
copylocker-types = { workspace = true }
copylocker-suite = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
copylocker-suite-std = { workspace = true, features = ["std", "pq-ml-dsa-65", "deterministic-rng"] }
rand_chacha = { workspace = true }
rand_core = { workspace = true }

[lints]
workspace = true
