[package]
name = "copylocker-cli"
description = "CopyLocker administration, protocol inspection, and development CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "copylocker"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
clap = { workspace = true }
copylocker-proto = { workspace = true }
copylocker-server-core = { workspace = true, features = ["serde"] }
copylocker-suite = { workspace = true, features = ["std"] }
copylocker-suite-std = { workspace = true, features = ["std", "pq-ml-dsa-65"] }
copylocker-suite-testkit = { workspace = true }
copylocker-types = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true, features = ["alloc"] }
hmac = { workspace = true }
qrcode = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
