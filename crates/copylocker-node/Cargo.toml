[package]
name = "copylocker-node"
description = "napi-rs native module for CopyLocker Electron integrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = { workspace = true, features = ["std"] }
copylocker-client = { workspace = true }
copylocker-core = { workspace = true, features = ["std"] }
copylocker-proto = { workspace = true, features = ["std"] }
copylocker-suite = { workspace = true, features = ["std"] }
copylocker-suite-std = { workspace = true, features = ["std", "pq-ml-dsa-65"] }
copylocker-types = { workspace = true, features = ["std"] }
log = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }

[build-dependencies]
napi-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
