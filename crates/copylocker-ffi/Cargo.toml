[package]
name = "copylocker-ffi"
description = "Stable C ABI for embedding CopyLocker in native applications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
copylocker-client = { workspace = true }
copylocker-core = { workspace = true, features = ["std"] }
copylocker-proto = { workspace = true, features = ["std"] }
copylocker-suite = { workspace = true, features = ["std"] }
copylocker-suite-std = { workspace = true, features = ["std", "pq-ml-dsa-65"] }
copylocker-types = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[build-dependencies]
cbindgen = { workspace = true }

[lints]
workspace = true
