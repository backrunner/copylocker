language = "C"
include_guard = "COPYLOCKER_H"
pragma_once = true
cpp_compat = true
documentation = true
usize_is_size_t = true
style = "both"

header = """
/* Generated by cbindgen. Do not edit manually. */
"""

[parse]
parse_deps = false

[export]
include = [
  "cl_buf",
  "cl_bytes",
  "cl_client",
  "cl_config",
  "cl_error",
  "cl_str",
  "CL_FAILURE",
  "CL_STATE_ACTIVATING",
  "CL_STATE_ACTIVE",
  "CL_STATE_ERROR",
  "CL_STATE_GRACE",
  "CL_STATE_LOCKED",
  "CL_STATE_NEEDS_REVALIDATION",
  "CL_STATE_REVOKED",
  "CL_STATE_TAMPERED",
  "CL_STATE_UNLICENSED",
  "CL_SUCCESS",
  "cl_activate",
  "cl_challenge",
  "cl_create",
  "cl_deactivate",
  "cl_destroy",
  "cl_free_buf",
  "cl_import_olk",
  "cl_offline_import",
  "cl_offline_request",
  "cl_state",
  "cl_unseal",
]
