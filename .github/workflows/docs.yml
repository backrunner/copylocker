name: Docs

# Builds the svedocs documentation site. Deploys to Cloudflare Pages only when the
# CL_DOCS_DEPLOY repository variable is 'true' and the CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID secrets are configured; otherwise the workflow is a
# build-only check.

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check
        run: npm run check
      - name: Build the site
        run: npm run build

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # Disabled until the repository variable CL_DOCS_DEPLOY is set to 'true' and the
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are configured.
    if: github.repository == 'backrunner/copylocker' && vars.CL_DOCS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Deploy
        run: npm run deploy
