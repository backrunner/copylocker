name: Fuzz

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_decode_cbor
          - fuzz_decode_envelope
          - fuzz_decode_artifacts
          - fuzz_license_key_parse
          - fuzz_core_handle
          - fuzz_server_activate
          - fuzz_server_validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz
      - name: Fuzz
        working-directory: fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '14400' || '60' }}
        run: |
          set -e
          # Long runs restart the fuzzer process every segment: libFuzzer/ASAN
          # accrues RSS per exec on large corpora, so one continuous multi-hour
          # process crosses the default 2048 MB limit and dies with exit 71
          # even though the targets themselves hold a flat RSS (see agent.md).
          segment=1800
          remaining="$FUZZ_SECONDS"
          while [ "$remaining" -gt 0 ]; do
            step=$(( remaining < segment ? remaining : segment ))
            cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time="$step" -max_len=65536
            remaining=$(( remaining - step ))
          done
