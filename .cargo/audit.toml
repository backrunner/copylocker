[advisories]
ignore = [
    # Tauri 2.11.5 is the current release and still uses the gtk-rs 0.18
    # WebKitGTK stack on Linux. Remove these when Tauri leaves GTK3.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # The affected glib::VariantStrIter API is not used by CopyLocker and is
    # reachable only through the same Tauri GTK3 dependency stack.
    "RUSTSEC-2024-0429",
    # Tauri 2.11.5 -> tauri-utils 2.9.3 -> urlpattern 0.3.0 currently uses
    # these unmaintained UNIC data crates. Remove them with that upstream chain.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

# Any advisory not listed above, including future informational advisories,
# remains release-blocking even when cargo audit is run without CLI flags.
[output]
deny = ["warnings"]
quiet = false
